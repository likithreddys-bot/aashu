<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff9a3c">
<title>For Aashu</title>
<link rel="preload" href="fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body class="locked">

<canvas id="stage3d" aria-hidden="true"></canvas>

<!-- Gate: a gift box that opens -->
<section id="gate" class="gate">
  <div class="rays" aria-hidden="true"></div>
  <div class="gift" id="gift" aria-hidden="true">
    <div class="lid"><div class="bow"><i></i><i></i></div></div>
    <div class="box"><div class="ribbon"></div></div>
  </div>
  <h1 id="gateTitle">Aashu, this is for you</h1>
  <p class="gate-sub">Turn your volume up a little 🔊</p>
  <input id="pw" type="password" placeholder="secret word" autocomplete="off" hidden>
  <button id="openBtn" class="btn">Open your gift</button>
  <p id="pwErr" class="err" hidden>Hmm, not that one. Try again 😉</p>
  <p id="loading" class="loading">getting things ready…</p>
</section>
<div id="flash" aria-hidden="true"></div>

<!-- Intro overlay -->
<div id="hud" hidden>
  <h2 class="title" id="title"><span class="t1">Happy Birthday</span><span class="t2" id="titleName"></span></h2>
  <div class="bubble" id="bubble" hidden><b class="who" id="bubbleWho"></b><span id="bubbleText"></span><i class="tap">tap ▸</i></div>
  <button class="skip" id="skip">Skip intro ▸</button>
  <div class="scrollhint" id="scrollHint" hidden><span>Scroll down</span><i></i></div>
</div>

<button id="musicBtn" class="music-btn" aria-label="Music on or off" hidden><span class="eq"><i></i><i></i><i></i></span></button>
<div id="ytPlayer"></div>
<audio id="songAudio" loop preload="none"></audio>
<audio id="voice" preload="none"></audio>

<main id="story">
  <div class="intro-space"></div>
  <section id="chapters"></section>
  <section id="drama" class="block"></section>
  <section id="song" class="block"></section>
  <section id="gallery" class="block"></section>
  <section id="bearBlock" class="block"></section>
  <section id="counter" class="block"></section>
  <section id="quiz" class="block"></section>
  <section id="letter" class="block"></section>
  <section id="finale">
    <div class="finale-ui">
      <h2 id="wish"></h2>
      <div class="finale-bottom">
        <div class="bubble finale-bubble" id="finaleBubble" hidden><b class="who">Masha</b><span id="finaleText"></span></div>
        <p class="hint" id="blowHint">Blow into your phone to blow out the candle</p>
        <button class="btn" id="blowBtn">Blow 🎤</button>
        <button class="link" id="tapBlow">or just tap here</button>
        <p class="surprise" id="surprise" hidden></p>
        <p class="song-credit" id="songCredit" hidden></p>
      </div>
    </div>
  </section>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="content.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
