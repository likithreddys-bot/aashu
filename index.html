<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffb347">
<title>For Aashu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Gate -->
<section id="gate" class="gate">
  <div class="gate-box">
    <div class="gift">🎁</div>
    <h1 id="gateTitle">Aashu, this is for you</h1>
    <p>Turn your volume up a little.</p>
    <input id="pw" type="password" placeholder="secret word" hidden>
    <button id="openBtn" class="btn">Tap to open</button>
    <p id="pwErr" class="err" hidden>Hmm, not that one. Try again 😉</p>
  </div>
</section>

<!-- Music toggle + mini player -->
<button id="musicBtn" class="music-btn" aria-label="Toggle music" hidden>♪</button>
<div id="ytWrap" class="yt-wrap"><div id="ytPlayer"></div></div>
<audio id="songAudio" loop preload="none"></audio>
<audio id="voice" preload="none"></audio>

<main id="app" hidden>

  <!-- Intro: Masha & Bear -->
  <section class="stage" id="intro">
    <div class="bunting" aria-hidden="true"></div>
    <h2 class="banner">Happy Birthday<br><span id="bannerName"></span>!</h2>
    <div class="sun"></div>
    <div class="hill"></div>
    <div class="chars">
      <div class="char masha" id="masha"></div>
      <div class="char bear"  id="bear"></div>
    </div>
    <div class="bubble" id="bubble"><span id="bubbleText"></span><i class="tap">tap ▸</i></div>
    <div class="scrollhint" id="scrollHint" hidden>scroll down ↓</div>
  </section>

  <!-- Chapters -->
  <section id="chapters"></section>

  <!-- Bear -->
  <section class="block bearblock" id="bearBlock"></section>

  <!-- Counter -->
  <section class="block counter" id="counter">
    <p class="kicker">Together since 11 January 2025</p>
    <div class="clock">
      <div><b id="cD">0</b><span>days</span></div>
      <div><b id="cH">0</b><span>hours</span></div>
      <div><b id="cM">0</b><span>min</span></div>
      <div><b id="cS">0</b><span>sec</span></div>
    </div>
    <p class="small">...and still counting. 🍊</p>
  </section>

  <!-- Quiz -->
  <section class="block quiz" id="quiz">
    <p class="kicker">Mini game</p>
    <h2>How well do you know us?</h2>
    <div id="quizBox"></div>
  </section>

  <!-- Letter -->
  <section class="block letter" id="letterBlock">
    <p class="kicker">A letter</p>
    <div class="paper"><div id="letterText"></div></div>
  </section>

  <!-- Finale -->
  <section class="block finale" id="finale">
    <h2 id="wish"></h2>
    <div class="cake" id="cake">
      <div class="flame" id="flame"></div>
      <div class="candle"></div>
      <div class="layer l1"></div><div class="layer l2"></div>
    </div>
    <p class="small" id="blowHint">Blow into your phone, or tap the button.</p>
    <button class="btn" id="blowBtn">Blow the candle 🕯️</button>
    <div id="surprise" class="surprise" hidden></div>
    <p class="song-credit" id="songCredit" hidden></p>
  </section>

</main>

<canvas id="confetti"></canvas>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
